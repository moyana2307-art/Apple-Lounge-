# Netlify deployment config — place at frontend/
[build]
  base = ""
  command = "npm run build"
  publish = ".next"

# NOTE: For Next.js on Netlify, install the "Next Runtime" via the Netlify
# UI (Build & deploy > Continuous Deployment) rather than relying on this file.
# The Next runtime auto-detects the project and runs `next build`.
# This file mainly documents the intended settings.
